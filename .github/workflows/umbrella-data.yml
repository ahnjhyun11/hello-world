name: umbrella-data
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node umbrella/fetch-data.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit data
        run: |
          git config user.name "umbrella-bot"
          git config user.email "umbrella-bot@users.noreply.github.com"
          git add umbrella/data
          git diff --staged --quiet || (git commit -m "chore: update UMBRELLA factor data" && git push)
